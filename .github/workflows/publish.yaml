name: Test and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: pip install -r requirements.lock
      - run: pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/frontend.test.cjs
        env:
          FRONTEND_BROWSER: chromium

  publish:
    if: github.event_name != 'pull_request' && github.repository == 'holyful/shanghai-telecom-iptv'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and publish Linux amd64 image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "$image:sha-${COMMIT:0:12}" .
          docker push "$image:sha-${COMMIT:0:12}"
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            docker tag "$image:sha-${COMMIT:0:12}" "$image:${REF_NAME#v}"
            docker push "$image:${REF_NAME#v}"
            docker tag "$image:sha-${COMMIT:0:12}" "$image:latest"
            docker push "$image:latest"
          else
            docker tag "$image:sha-${COMMIT:0:12}" "$image:edge"
            docker push "$image:edge"
          fi