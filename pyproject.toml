[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shanghai-telecom-iptv"
version = "0.1.0"
description = "Self-hosted Shanghai Telecom IPTV guide and playlist service"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<47", "tzdata>=2024.1"]
license = "MIT"

[project.scripts]
homecast = "iptv_lan.server:main"

[tool.setuptools.package-data]
iptv_lan = ["static/*", "static/assets/*", "static/vendor/*"]

[tool.setuptools.packages.find]
include = ["iptv_lan*"]
